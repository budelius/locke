[project]
name = "locke"
version = "0.10.0"
description = "Unified credentials framework — encrypted config, OS keystore, Vaultwarden integration"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "keyring>=25.0",
    "cryptography>=42.0",
    "click>=8.1",
    "httpx>=0.27",
    "winrt-runtime>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Security.Credentials.UI>=3.0; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://gitlab.com/martin-wieser/locke"
Repository = "https://gitlab.com/martin-wieser/locke"
Issues = "https://gitlab.com/martin-wieser/locke/-/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
locke = "locke.cli.main:cli"
locke-genkeys = "locke.cli.project_tools:genkeys"
locke-strip-jsonc = "locke.cli.project_tools:strip_jsonc_command"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["locke"]

[tool.pytest.ini_options]
testpaths = ["tests"]
