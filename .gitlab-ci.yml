stages:
  - lint
  - publish

# Every job runs on Obachan's own runner. GitLab's shared runners are out of
# quota on this project, so an untagged job does not queue -- it fails outright
# with `ci_quota_exceeded` before it starts. Setting this as a default rather
# than per-job means a future job cannot silently inherit that failure.
#
# `obachan-staging-oss` is the isolated runner for public projects: tagged-only
# and ref_protected, so an outside contributor's branch cannot execute on our
# cluster. The consequence is that jobs only run on protected refs.
default:
  tags:
    - obachan-staging-oss

# Branch pipelines only, and only on protected refs.
#
# The runner above is `ref_protected`, and GitLab never marks a detached
# merge-request ref (`refs/merge-requests/N/head`) as protected -- so a merge
# request pipeline can never acquire this runner and queues forever. Verified
# on !11: the job sat pending with no runner even after protecting the source
# branch pattern.
#
# Running on the branch instead gives the same pre-merge signal on a ref the
# runner will accept. Maintainer branch prefixes are protected for exactly this
# reason; an outside contributor's branch stays unprotected, gets no pipeline,
# and therefore never executes on our cluster.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_REF_PROTECTED == "true"
    - when: never

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

lint:
  stage: lint
  image: python:3.13-slim
  script:
    # Pinned: an unpinned install let CI drift ahead of every developer's local
    # ruff, so a change that linted clean locally failed here on rules the older
    # version did not have. Bump deliberately, with the findings in the same MR.
    - pip install "ruff==0.16.5"
    - cd python
    - ruff check .
  # No rules: the workflow above already restricts this to protected refs and
  # tags, which is every ref lint should gate. An earlier per-job rule list ran
  # lint only on merge requests and on a "dev" branch that did not exist, while
  # every commit went straight to main -- so the gate never ran at all and 76
  # findings accumulated behind it.

publish:python:
  stage: publish
  image: python:3.13-slim
  script:
    - pip install hatch twine
    - cd python
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        # Tagged release -- use version from pyproject.toml as-is
        hatch build
      else
        # Branch push -- PEP 440 dev version: X.Y.Z.dev<pipeline_id>
        BASE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        sed -i "s/^version = \".*\"/version = \"${BASE_VERSION}.dev${CI_PIPELINE_IID}\"/" pyproject.toml
        hatch build
      fi

    # Publish to GitLab package registry
    - >
      TWINE_PASSWORD=${CI_JOB_TOKEN}
      TWINE_USERNAME=gitlab-ci-token
      twine upload
      --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi
      dist/*

    # Publish to PyPI (tagged releases only)
    - |
      if [ -n "$CI_COMMIT_TAG" ] && [ -n "$PYPI_API_TOKEN" ]; then
        export TWINE_PASSWORD="${PYPI_API_TOKEN}"
        export TWINE_USERNAME=__token__
        twine upload --non-interactive dist/*
      fi
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# npm — TypeScript package @martin-wieser/locke
# OIDC Trusted Publishing (no stored token). One-time setup required on
# npmjs.com: package Settings -> Trusted Publisher -> GitLab CI/CD with
#   namespace=martin-wieser, project=locke, CI file path=.gitlab-ci.yml,
#   environment=release  (requires npm CLI >= 11.5.1, Node >= 22.14.0).
# ---------------------------------------------------------------------------
publish:npm:
  stage: publish
  image: node:22
  environment: release
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
  before_script:
    - corepack enable
    - npm install -g npm@latest   # OIDC trusted publishing needs npm >= 11.5.1
  script:
    - cd typescript
    - npm install --ignore-scripts --no-package-lock   # fetch typescript; skip keytar native build
    - npm run build
    # npm CLI auto-detects the NPM_ID_TOKEN OIDC token; no token configured.
    # Check the two preconditions first: without them `npm publish` fails with
    # a bare ENEEDAUTH that says nothing about which half is missing. The
    # v0.10.0 release failed here with npm 11.7.0 and an issued token, which
    # points at the npmjs.com side (see the Trusted Publisher note above).
    - |
      if [ -z "$NPM_ID_TOKEN" ]; then
        echo "NPM_ID_TOKEN was not issued -- check id_tokens/environment on this job." >&2
        exit 1
      fi
      NPM_MAJOR_MINOR=$(npm --version | cut -d. -f1,2)
      echo "npm $(npm --version); OIDC id_token present (${#NPM_ID_TOKEN} chars)"
      case "$NPM_MAJOR_MINOR" in
        11.[5-9]|11.[1-9][0-9]|1[2-9].*|[2-9][0-9].*) ;;
        *) echo "npm $(npm --version) is below the 11.5.1 required for OIDC trusted publishing" >&2; exit 1 ;;
      esac
    - npm publish --access public --ignore-scripts
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

# ---------------------------------------------------------------------------
# crates.io — Rust crate locke-creds
# OIDC Trusted Publishing (no stored token). One-time setup required on
# crates.io: crate Settings -> Trusted Publishing -> GitLab with
#   namespace=martin-wieser, project=locke, workflow path=.gitlab-ci.yml,
#   environment=release.  (gitlab.com only; self-hosted not supported.)
# ---------------------------------------------------------------------------
publish:crates:
  stage: publish
  image: rust:1-bookworm
  environment: release
  id_tokens:
    CRATES_IO_ID_TOKEN:
      aud: crates.io
  before_script:
    # Two separate constraints from the hardened OSS runner, both about
    # privileges apt normally assumes it has.
    #
    # `APT::Sandbox::User=root` stops apt dropping to the _apt user: the runner
    # forbids privilege escalation, so its http method dies with
    # "setegid/seteuid/setgroups: Operation not permitted". apt still exits 0,
    # which is how the v0.10.0 release only noticed later as
    # `jq: command not found` mid token-exchange.
    #
    # The cache directories then have to move somewhere root can actually
    # write. The runner drops ALL capabilities, so root has no CAP_DAC_OVERRIDE
    # and cannot write Debian's _apt-owned, mode-700
    # /var/cache/apt/archives/partial -- every download fails with
    # "Could not open file ... Permission denied" even as root.
    - mkdir -p /tmp/apt/archives/partial /tmp/apt/lists/partial
    - |
      APT_OPTS="-o APT::Sandbox::User=root
                -o Dir::Cache::archives=/tmp/apt/archives
                -o Dir::State::lists=/tmp/apt/lists"
      apt-get $APT_OPTS update
      apt-get $APT_OPTS install -y --no-install-recommends curl jq pkg-config libssl-dev libdbus-1-dev
    # Assert the side effect, not the exit code.
    - for t in curl jq pkg-config; do command -v "$t" >/dev/null || { echo "$t missing after apt install" >&2; exit 1; }; done
  script:
    - cd rust
    # Exchange the GitLab OIDC token for a short-lived crates.io publish token.
    - |
      CARGO_REGISTRY_TOKEN=$(curl -sf -X POST https://crates.io/api/v1/trusted_publishing/tokens \
        -H "Content-Type: application/json" \
        -d "{\"jwt\":\"${CRATES_IO_ID_TOKEN}\"}" | jq -r '.token')
      if [ -z "$CARGO_REGISTRY_TOKEN" ] || [ "$CARGO_REGISTRY_TOKEN" = "null" ]; then
        echo "crates.io OIDC token exchange failed" >&2
        exit 1
      fi
      export CARGO_REGISTRY_TOKEN
    - cargo publish -p locke-creds
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
