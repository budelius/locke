stages:
  - lint
  - publish

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

lint:
  stage: lint
  image: python:3.13-slim
  script:
    - pip install ruff
    - cd python
    - ruff check .
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == "dev"

publish:
  stage: publish
  image: python:3.13-slim
  script:
    - pip install hatch twine
    - cd python
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        # Tagged release -- use version from pyproject.toml as-is
        hatch build
      else
        # Branch push -- PEP 440 dev version: X.Y.Z.dev<pipeline_id>
        BASE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        sed -i "s/^version = \".*\"/version = \"${BASE_VERSION}.dev${CI_PIPELINE_IID}\"/" pyproject.toml
        hatch build
      fi

    # Publish to GitLab package registry
    - >
      TWINE_PASSWORD=${CI_JOB_TOKEN}
      TWINE_USERNAME=gitlab-ci-token
      twine upload
      --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi
      dist/*

    # Publish to PyPI (tagged releases only)
    - |
      if [ -n "$CI_COMMIT_TAG" ] && [ -n "$PYPI_API_TOKEN" ]; then
        export TWINE_PASSWORD="${PYPI_API_TOKEN}"
        export TWINE_USERNAME=__token__
        twine upload --non-interactive dist/*
      fi
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
