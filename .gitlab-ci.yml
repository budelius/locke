stages:
  - lint
  - publish

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

lint:
  stage: lint
  image: python:3.13-slim
  script:
    - pip install ruff
    - cd python
    - ruff check .
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == "dev"
    # ...and on the default branch. Until now lint ran only on merge requests
    # and on a "dev" branch that did not exist, while every commit went
    # straight to main -- so the gate never ran and 76 findings accumulated
    # behind it.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

publish:python:
  stage: publish
  image: python:3.13-slim
  tags:
    - obachan-staging-oss
  script:
    - pip install hatch twine
    - cd python
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        # Tagged release -- use version from pyproject.toml as-is
        hatch build
      else
        # Branch push -- PEP 440 dev version: X.Y.Z.dev<pipeline_id>
        BASE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        sed -i "s/^version = \".*\"/version = \"${BASE_VERSION}.dev${CI_PIPELINE_IID}\"/" pyproject.toml
        hatch build
      fi

    # Publish to GitLab package registry
    - >
      TWINE_PASSWORD=${CI_JOB_TOKEN}
      TWINE_USERNAME=gitlab-ci-token
      twine upload
      --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi
      dist/*

    # Publish to PyPI (tagged releases only)
    - |
      if [ -n "$CI_COMMIT_TAG" ] && [ -n "$PYPI_API_TOKEN" ]; then
        export TWINE_PASSWORD="${PYPI_API_TOKEN}"
        export TWINE_USERNAME=__token__
        twine upload --non-interactive dist/*
      fi
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# npm — TypeScript package @budelius/locke
# OIDC Trusted Publishing (no stored token). One-time setup required on
# npmjs.com: package Settings -> Trusted Publisher -> GitLab CI/CD with
#   namespace=martin-wieser, project=locke, CI file path=.gitlab-ci.yml,
#   environment=release, allowed action=npm publish
#   (requires npm CLI >= 11.5.1, Node >= 22.14.0, and a GitLab.com shared
#   runner; npm does not support project/self-hosted GitLab runners for OIDC).
# ---------------------------------------------------------------------------
publish:npm:
  stage: publish
  image: node:22
  tags:
    - saas-linux-small-amd64
  environment: release
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
  before_script:
    - corepack enable
    - npm install -g npm@latest   # OIDC trusted publishing needs npm >= 11.5.1
  script:
    - cd typescript
    - npm install --ignore-scripts --no-package-lock   # fetch typescript; skip keytar native build
    - npm run build
    # npm CLI auto-detects the NPM_ID_TOKEN OIDC token; no token configured.
    # Check the locally observable preconditions first. Token presence and a
    # recent npm version do not prove that npm accepts the runner; that is why
    # this job must stay on a supported GitLab.com shared runner.
    - |
      if [ -z "$NPM_ID_TOKEN" ]; then
        echo "NPM_ID_TOKEN was not issued -- check id_tokens/environment on this job." >&2
        exit 1
      fi
      NPM_MAJOR_MINOR=$(npm --version | cut -d. -f1,2)
      echo "npm $(npm --version); OIDC id_token present (${#NPM_ID_TOKEN} chars)"
      case "$NPM_MAJOR_MINOR" in
        11.[5-9]|11.[1-9][0-9]|1[2-9].*|[2-9][0-9].*) ;;
        *) echo "npm $(npm --version) is below the 11.5.1 required for OIDC trusted publishing" >&2; exit 1 ;;
      esac
    - npm publish --access public --ignore-scripts
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

# ---------------------------------------------------------------------------
# crates.io — Rust crate locke-creds
# OIDC Trusted Publishing (no stored token). One-time setup required on
# crates.io: crate Settings -> Trusted Publishing -> GitLab with
#   namespace=martin-wieser, project=locke, workflow path=.gitlab-ci.yml,
#   environment=release.  (GitLab.com projects only; self-managed GitLab
#   instances are not supported.)
# ---------------------------------------------------------------------------
publish:crates:
  stage: publish
  image: rust:1-bookworm
  tags:
    - obachan-staging-oss
  environment: release
  id_tokens:
    CRATES_IO_ID_TOKEN:
      aud: crates.io
  before_script:
    # This runner cannot let apt drop privileges to the _apt user -- its http
    # method dies with "setegid/seteuid/setgroups: Operation not permitted".
    # apt still exits 0, so the v0.10.0 release only discovered the missing
    # packages later, as `jq: command not found` mid token-exchange.
    - apt-get -o APT::Sandbox::User=root update
    - apt-get -o APT::Sandbox::User=root install -y --no-install-recommends curl jq pkg-config libssl-dev libdbus-1-dev
    # Assert the side effect, not the exit code.
    - for t in curl jq pkg-config; do command -v "$t" >/dev/null || { echo "$t missing after apt install" >&2; exit 1; }; done
  script:
    - cd rust
    # Exchange the GitLab OIDC token for a short-lived crates.io publish token.
    - |
      CARGO_REGISTRY_TOKEN=$(curl -sf -X POST https://crates.io/api/v1/trusted_publishing/tokens \
        -H "Content-Type: application/json" \
        -d "{\"jwt\":\"${CRATES_IO_ID_TOKEN}\"}" | jq -r '.token')
      if [ -z "$CARGO_REGISTRY_TOKEN" ] || [ "$CARGO_REGISTRY_TOKEN" = "null" ]; then
        echo "crates.io OIDC token exchange failed" >&2
        exit 1
      fi
      export CARGO_REGISTRY_TOKEN
    - cargo publish -p locke-creds
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
    # Recover a release whose tag pipeline failed without moving/recreating
    # the tag. Start a pipeline on main with PUBLISH_CRATES=1; main must still
    # contain the unpublished Cargo.toml version.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PUBLISH_CRATES == "1"'
